name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python_version: ['3.12']
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
    - name: Install poetry
      run: pipx install poetry
    - name: Install dependencies
      run: |
        poetry env use python${{ matrix.python_version }}
        poetry install
    - name: Run tests
      run: |
        poetry run pytest --cov=aw_research tests/ aw_research/*.py
    - name: Typecheck
      # Pre-existing type errors; informational until they are fixed.
      continue-on-error: true
      run: |
        poetry run mypy --ignore-missing-imports --check-untyped-defs aw_research/ examples/ tests/
